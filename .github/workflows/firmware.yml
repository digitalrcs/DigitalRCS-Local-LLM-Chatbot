name: Firmware
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable controls and connection rules
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/control_logic_test.cpp -o /tmp/control-test
          /tmp/control-test
      - name: Verify generated artwork and setup page
        run: |
          python scripts/generate_frog.py
          python scripts/embed_setup.py
          git diff --exit-code -- firmware/Franky/FrogArt.h firmware/Franky/SetupPage.h docs/images
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned board package and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@4.0.0-alpha1 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install 'ArduinoJson@7.4.3' 'Adafruit GFX Library@1.12.6' 'Adafruit ST7735 and ST7789 Library@1.11.0' 'Adafruit BusIO@1.17.4'
      - name: Compile LA064 firmware
        run: arduino-cli compile --jobs 4 --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CDCOnBoot=default' firmware/Franky
